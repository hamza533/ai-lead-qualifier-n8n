# n8n + Postgres + task runners for development and demos.
# `make dev` starts it; the `test` profile adds the mock server used by the
# end-to-end tests and CI (see docker-compose.test.yml).
name: leadpilot

# Only what n8n and the workflows need is passed in (not the whole .env): expressions can
# read the environment ($env), so API keys, tokens and passwords stay out of it. They live
# in n8n credentials, created from .env on the host by `make credentials`.
x-n8n-env: &n8n-env
  environment:
    # n8n itself
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run make setup first}
    N8N_HOST: ${N8N_HOST:-localhost}
    N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
    N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
    GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/London}
    N8N_INSTANCE_OWNER_MANAGED_BY_ENV: ${N8N_INSTANCE_OWNER_MANAGED_BY_ENV:-true}
    N8N_INSTANCE_OWNER_EMAIL: ${N8N_INSTANCE_OWNER_EMAIL:-owner@example.test}
    N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_INSTANCE_OWNER_FIRST_NAME:-Lead}
    N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_INSTANCE_OWNER_LAST_NAME:-Pilot}
    N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_INSTANCE_OWNER_PASSWORD_HASH}
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
    DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
    DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
    DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER:-n8n}
    DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?run make setup first}
    EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
    EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
    N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?run make setup first}
    # Workflow settings (read with $env in the workflows; nothing secret except the HMAC
    # secret, which a Code node needs to verify webhook signatures)
    GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
    LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
    TAVILY_BASE_URL: ${TAVILY_BASE_URL:-https://api.tavily.com}
    HUBSPOT_BASE_URL: ${HUBSPOT_BASE_URL:-https://api.hubapi.com}
    SLACK_BASE_URL: ${SLACK_BASE_URL:-https://slack.com/api}
    SLACK_APPROVAL_CHANNEL: ${SLACK_APPROVAL_CHANNEL:-}
    SLACK_ALERTS_CHANNEL: ${SLACK_ALERTS_CHANNEL:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    BOOKING_LINK: ${BOOKING_LINK:-}
    FOLLOW_UP_DAYS: ${FOLLOW_UP_DAYS:-3}
    APPROVAL_TIMEOUT_HOURS: ${APPROVAL_TIMEOUT_HOURS:-24}
    APPROVAL_REMINDER_HOURS: ${APPROVAL_REMINDER_HOURS:-4}
    WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?run make setup first}
    DEMO_MODE: ${DEMO_MODE:-true}
    DEMO_EMAIL_ALLOWLIST: ${DEMO_EMAIL_ALLOWLIST:-}
    DRY_RUN: ${DRY_RUN:-false}
    EVAL_AUTO_APPROVE: ${EVAL_AUTO_APPROVE:-false}
    LEADPILOT_DB_NAME: ${LEADPILOT_DB_NAME:-leadpilot}
    LEAD_RETENTION_DAYS: ${LEAD_RETENTION_DAYS:-30}
    # n8n configuration
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    # File nodes may only read the mounted config folder.
    N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
    # Code nodes run in the separate task-runners container (n8n 2.x recommended mode).
    N8N_RUNNERS_MODE: external
    N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    N8N_RUNNERS_TASK_TIMEOUT: "60"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    N8N_SECURE_COOKIE: "false" # dev over http://localhost; the tunnel and Azure use HTTPS
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
    N8N_LOG_FORMAT: json
    N8N_LOG_LEVEL: info

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_POSTGRESDB_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD:?run make setup first}
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:2.49.6
    restart: unless-stopped
    <<: *n8n-env
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/home/node/.n8n-files/config:ro
      - ./workflows:/workflows
      - ./.tmp/n8n-io:/io
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  task-runners:
    image: n8nio/runners:2.49.6
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?run make setup first}
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      # Code nodes may use node:crypto (HMAC check, lead hash). Nothing else.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
    depends_on:
      - n8n

  mock:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/mock_server/Dockerfile
    image: leadpilot-mock:dev
    ports:
      - "127.0.0.1:${MOCK_HOST_PORT:-8099}:8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    profiles: ["test"]
    image: axllent/mailpit:v1.27.11
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"

volumes:
  postgres_data:
  n8n_data:
