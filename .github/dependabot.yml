version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Image tags (n8n, Postgres, mailpit) are pinned on purpose; Dependabot proposes bumps,
  # which follow the upgrade runbook in the README.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /tests/mock_server
    schedule:
      interval: weekly
