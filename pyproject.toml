[project]
name = "leadpilot-harness"
version = "0.1.0"
description = "Test harness, mock server, admin scripts and evaluation for the ai-lead-qualifier-n8n workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "bcrypt>=4.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: needs a running n8n + mock server (make test-e2e)",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"] # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
# S608: e2e helpers build SQL from test-controlled values only
"tests/**" = ["S105", "S106", "S311", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests", "eval"]
